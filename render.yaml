# Render free-tier deployment (Infrastructure-as-Code: render.com/docs/blueprint-spec).
# Import once at render.com/select-repo. `autoDeploy: false` because deploys are
# triggered by CI (.github/workflows/ci.yml) only after tests pass, via a Render
# "Deploy Hook" URL saved as the RENDER_DEPLOY_HOOK_URL GitHub secret (Settings ->
# Deploy Hook on the service, once created -> repo Settings -> Secrets and variables).
services:
  - type: web
    name: hr-agent
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    # Ingest runs HERE, in the build step, not at runtime. Found live (Day 14): after
    # the Day 13 corpus expansion (97 -> 177 chunks), the deployed service crash-looped
    # under real chat traffic - a live /chat request calling tools would get ~60-70s in
    # and then the WHOLE container would restart (no OOM banner, same "proactively
    # cycling near the limit" signature as earlier incidents), discarding the in-flight
    # request. Root-caused via `render logs` across several restarts: every single
    # restart - not just cold starts - was re-downloading the 79MB ONNX model and
    # re-embedding all 177 chunks from scratch before serving again, meaning the
    # (large, batch-bounded but still real) embedding memory spike was recurring on
    # every crash, not just once per deploy, and competing with a live request's own
    # memory use is plausibly exactly what was pushing it over 512Mi. Moving ingestion
    # into the build step means the running process's get_ready_collection() sees a
    # non-empty collection immediately (count_chunks() > 0) and never calls ingest()
    # at all - the live process only ever embeds one short query at a time after this,
    # never the whole corpus, and every restart (cold start or crash) comes back with
    # the index already on disk instead of rebuilding it. `--smoke` fails the build
    # (not a half-broken deploy) if retrieval quality regresses.
    buildCommand: pip install -r requirements.txt && python -m app.ingest --reset --smoke
    # Ingest is NOT a startCommand pre-step: `X && uvicorn ...` doesn't start uvicorn
    # (so no port opens) until X finishes, and uvicorn itself binds its socket only
    # after its own lifespan-startup handler returns. On free-tier CPU with no
    # persistent disk (every cold start re-embeds the corpus from scratch), that
    # routinely exceeded Render's port-scan timeout - first real deploy failed with
    # "no open ports detected". Fix: the FastAPI process never ingests at all;
    # mcp/server.py's subprocess builds the index itself, concurrently with serving
    # requests, so nothing here blocks the port from opening. (Now, per the build-step
    # fix above, it doesn't need to build anything at all in the common case - it just
    # finds the index already populated from the build step and serves immediately.)
    #
    # A second, separate failure ("Out of memory, used over 512Mi") showed up once
    # the port-bind issue was fixed: app/main.py's lifespan was *also* eagerly
    # building the index in the FastAPI process, while the MCP subprocess
    # independently built its own copy on first search - two full onnxruntime
    # sessions live at once. Fix: only the MCP subprocess ever loads the embedding
    # model now (app/ingest.py's get_ready_collection(), used only from
    # app/retriever.py); the FastAPI process only ever calls the lightweight
    # count_chunks(). See CLAUDE.md's Day 8 entry for the measurements.
    #
    # That fix cut peak memory a lot but a real deploy still needed 2 attempts to
    # survive cold-start ingestion (crashed at ~56/97 chunks once, succeeded on
    # retry) - a stdio subprocess is still a second whole Python process's baseline
    # on top of an already-tight budget. MCP_TRANSPORT=inmemory below runs the same
    # tools in the FastAPI process itself instead (app/agent.py's in-memory MCP
    # transport), for real margin instead of a marginal pass. Local dev and every
    # test still default to "stdio" (a real subprocess, the actual demonstrated MCP
    # architecture) - this override is deploy-specific.
    # --loop asyncio --http h11: uvicorn[standard] auto-picks uvloop/httptools when
    # installed, which measured ~20MB higher RSS for no benefit this app needs
    # (uvloop/httptools are throughput optimizations; a low-traffic demo API on a
    # memory-constrained free tier should trade that for the lower baseline instead).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # set manually in the Render dashboard; never committed
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free # check this is still live; see CLAUDE.md
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: MCP_TRANSPORT
        value: inmemory
      - key: PYTHON_VERSION
        value: 3.12.7
