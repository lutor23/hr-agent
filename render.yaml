# Render free-tier deployment (Infrastructure-as-Code: render.com/docs/blueprint-spec).
# Import once at render.com/select-repo. `autoDeploy: false` because deploys are
# triggered by CI (.github/workflows/ci.yml) only after tests pass, via a Render
# "Deploy Hook" URL saved as the RENDER_DEPLOY_HOOK_URL GitHub secret (Settings ->
# Deploy Hook on the service, once created -> repo Settings -> Secrets and variables).
services:
  - type: web
    name: hr-agent
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # Ingest is NOT a startCommand pre-step: `X && uvicorn ...` doesn't start uvicorn
    # (so no port opens) until X finishes, and uvicorn itself binds its socket only
    # after its own lifespan-startup handler returns. Embedding the corpus (loading
    # sentence-transformers, downloading the ~90MB model with no persistent disk to
    # cache it, embedding ~100 chunks) on free-tier CPU routinely exceeds Render's
    # port-scan timeout, which previously failed every deploy with "no open ports
    # detected". app/main.py's lifespan instead fires the index build as a
    # background asyncio task it never awaits, so uvicorn binds the port immediately;
    # /health reports {"status": "degraded"} (503) until that background build
    # finishes, same as it always has for an empty index. This still exercises the
    # real 512MB runtime container per the note below - it just no longer blocks
    # the port from opening while doing so.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # set manually in the Render dashboard; never committed
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free # check this is still live; see CLAUDE.md
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: PYTHON_VERSION
        value: 3.12.7
