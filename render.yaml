# Render free-tier deployment (Infrastructure-as-Code: render.com/docs/blueprint-spec).
# Import once at render.com/select-repo. `autoDeploy: false` because deploys are
# triggered by CI (.github/workflows/ci.yml) only after tests pass, via a Render
# "Deploy Hook" URL saved as the RENDER_DEPLOY_HOOK_URL GitHub secret (Settings ->
# Deploy Hook on the service, once created -> repo Settings -> Secrets and variables).
services:
  - type: web
    name: hr-agent
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # Ingest is NOT a startCommand pre-step: `X && uvicorn ...` doesn't start uvicorn
    # (so no port opens) until X finishes, and uvicorn itself binds its socket only
    # after its own lifespan-startup handler returns. On free-tier CPU with no
    # persistent disk (every cold start re-embeds the corpus from scratch), that
    # routinely exceeded Render's port-scan timeout - first real deploy failed with
    # "no open ports detected". Fix: the FastAPI process never ingests at all;
    # mcp/server.py's subprocess builds the index itself, concurrently with serving
    # requests, so nothing here blocks the port from opening.
    #
    # A second, separate failure ("Out of memory, used over 512Mi") showed up once
    # the port-bind issue was fixed: app/main.py's lifespan was *also* eagerly
    # building the index in the FastAPI process, while the MCP subprocess
    # independently built its own copy on first search - two full onnxruntime
    # sessions live at once. Fix: only the MCP subprocess ever loads the embedding
    # model now (app/ingest.py's get_ready_collection(), used only from
    # app/retriever.py); the FastAPI process only ever calls the lightweight
    # count_chunks(). See CLAUDE.md's Day 8 entry for the measurements.
    # --loop asyncio --http h11: uvicorn[standard] auto-picks uvloop/httptools when
    # installed, which measured ~20MB higher RSS for no benefit this app needs
    # (uvloop/httptools are throughput optimizations; a low-traffic demo API on a
    # memory-constrained free tier should trade that for the lower baseline instead).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --loop asyncio --http h11
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # set manually in the Render dashboard; never committed
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free # check this is still live; see CLAUDE.md
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: PYTHON_VERSION
        value: 3.12.7
