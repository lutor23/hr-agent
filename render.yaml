# Render free-tier deployment (Infrastructure-as-Code: render.com/docs/blueprint-spec).
# Import once at render.com/select-repo. `autoDeploy: false` because deploys are
# triggered by CI (.github/workflows/ci.yml) only after tests pass, via a Render
# "Deploy Hook" URL saved as the RENDER_DEPLOY_HOOK_URL GitHub secret (Settings ->
# Deploy Hook on the service, once created -> repo Settings -> Secrets and variables).
services:
  - type: web
    name: hr-agent
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # Ingest runs here (not in buildCommand) so it executes in the same 512MB runtime
    # container the app will actually run in - Render's build-step resources aren't
    # something to assume without checking. Adds a few seconds to every cold start;
    # see CLAUDE.md Day 8 for the open question of whether it fits in 512MB at all.
    startCommand: python -m app.ingest --reset && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # set manually in the Render dashboard; never committed
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b:free # check this is still live; see CLAUDE.md
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: PYTHON_VERSION
        value: 3.12.7
