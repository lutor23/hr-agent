<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="940" height="760" fill="#ffffff"/>

  <!-- Browser / curl -->
  <rect x="370" y="20" width="200" height="54" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="470" y="53" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Browser / curl</text>

  <line x1="470" y1="74" x2="470" y2="112" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="98" font-size="12" fill="#475569">POST /chat, GET /health</text>

  <!-- FastAPI app -->
  <rect x="270" y="114" width="400" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="470" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">FastAPI app — app/main.py</text>
  <text x="470" y="160" text-anchor="middle" font-size="12.5" fill="#075985">one long-lived HRAgent, shared across requests</text>
  <text x="470" y="177" text-anchor="middle" font-size="12.5" fill="#075985">/health reports MCP connectivity + index size</text>

  <line x1="470" y1="190" x2="470" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="214" font-size="12" fill="#475569">agent.run(message, employee_id)</text>

  <!-- Agent orchestrator -->
  <rect x="245" y="230" width="450" height="92" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="470" y="256" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">Agent orchestrator — app/agent.py</text>
  <text x="470" y="276" text-anchor="middle" font-size="12.5" fill="#075985">OpenAI-format tool-calling loop (max 6 steps)</text>
  <text x="470" y="293" text-anchor="middle" font-size="12.5" fill="#075985">builds the operational trace; verifies every citation</text>
  <text x="470" y="310" text-anchor="middle" font-size="12.5" fill="#075985">against a real tool result before showing it</text>

  <line x1="470" y1="322" x2="470" y2="362" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="338" font-size="12" fill="#475569">real MCP protocol</text>
  <text x="490" y="353" font-size="11" fill="#64748b">ClientSession.list_tools() / call_tool()</text>

  <!-- LLM provider (side) -->
  <rect x="740" y="248" width="170" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="825" y="272" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">LLM provider</text>
  <text x="825" y="290" text-anchor="middle" font-size="11.5" fill="#92400e">OpenRouter</text>
  <line x1="695" y1="276" x2="736" y2="276" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- MCP server -->
  <rect x="245" y="364" width="450" height="68" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">MCP server — mcp/server.py</text>
  <text x="470" y="410" text-anchor="middle" font-size="12.5" fill="#14532d">7 tools: search, get-section, employee/PTO/benefits lookups, create-ticket, draft-email</text>

  <!-- transport note -->
  <text x="470" y="448" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">stdio subprocess locally &amp; in tests · in-process (MCP_TRANSPORT=inmemory) on the Render deploy</text>

  <line x1="380" y1="432" x2="330" y2="486" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="432" x2="610" y2="486" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RAG index -->
  <rect x="150" y="488" width="330" height="140" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="315" y="514" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">RAG index</text>
  <text x="315" y="536" text-anchor="middle" font-size="12.5" fill="#4c1d95">ChromaDB + ONNX MiniLM-L6-v2 embeddings</text>
  <text x="315" y="556" text-anchor="middle" font-size="12.5" fill="#4c1d95">corpus/ — 17 policy documents</text>
  <text x="315" y="576" text-anchor="middle" font-size="12.5" fill="#4c1d95">(15 Markdown, 1 HTML, 1 PDF)</text>
  <text x="315" y="596" text-anchor="middle" font-size="12.5" fill="#4c1d95">177 heading-aware chunks</text>
  <text x="315" y="616" text-anchor="middle" font-size="12.5" fill="#4c1d95">cosine similarity, score ≥ 0.25</text>

  <!-- Mock employee data -->
  <rect x="520" y="488" width="270" height="140" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="655" y="514" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Mock employee data</text>
  <text x="655" y="536" text-anchor="middle" font-size="12.5" fill="#7f1d1d">mock_data/*.json</text>
  <text x="655" y="558" text-anchor="middle" font-size="12.5" fill="#7f1d1d">10 employees (E001–E010)</text>
  <text x="655" y="578" text-anchor="middle" font-size="12.5" fill="#7f1d1d">PTO balances, benefits</text>
  <text x="655" y="598" text-anchor="middle" font-size="12.5" fill="#7f1d1d">mock tickets (in-memory only,</text>
  <text x="655" y="616" text-anchor="middle" font-size="12.5" fill="#7f1d1d">reset on restart)</text>

  <!-- Legend -->
  <rect x="150" y="668" width="640" height="76" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="166" y="682" width="16" height="16" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="190" y="695" font-size="12" fill="#334155">Web app / orchestrator (app/)</text>
  <rect x="166" y="706" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="190" y="719" font-size="12" fill="#334155">MCP server (mcp/)</text>
  <rect x="420" y="682" width="16" height="16" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="444" y="695" font-size="12" fill="#334155">RAG data</text>
  <rect x="420" y="706" width="16" height="16" rx="3" fill="#fee2e2" stroke="#dc2626"/>
  <text x="444" y="719" font-size="12" fill="#334155">Mock data</text>
  <rect x="560" y="682" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="584" y="695" font-size="12" fill="#334155">External LLM</text>
</svg>
