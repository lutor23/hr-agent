name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # sentence-transformers downloads all-MiniLM-L6-v2 (~90MB) from HF Hub on first
      # use; cache it so most runs don't re-download it.
      - name: Cache embedding model
        # Path updated on Day 8: embeddings moved from sentence-transformers
        # (~/.cache/huggingface) to chromadb's bundled ONNX runtime, which caches
        # the model at ~/.cache/chroma/onnx_models instead (see app/ingest.py's
        # get_embedding_function()). The old path was stale and never hit.
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma/onnx_models
          key: onnx-minilm-l6-v2-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Import check
        run: python -c "import app.main; import app.agent; import app.ingest; print('app imports OK')"

      - name: Build the vector index
        run: python -m app.ingest --reset --smoke

      # Real app-starts check: bind an actual port and hit /health over HTTP, distinct
      # from the in-process TestClient checks that pytest runs below.
      - name: App-starts check
        run: |
          python -m uvicorn app.main:app --port 8010 &
          server_pid=$!
          trap "kill $server_pid" EXIT
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:8010/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "health status: $code"; cat /tmp/health.json; echo
          test "$code" = "200"
          python -c "import json; h=json.load(open('/tmp/health.json')); assert h['mcp_connected'] and h['mcp_tools'] == 7, h"

      # Covers the ">=5 MCP tools, discovered and called through the MCP layer"
      # requirement (tests/test_mcp_tools.py, tests/test_agent.py) and the API
      # app-starts test (tests/test_api.py), alongside everything else.
      - name: Tests
        run: pytest tests/ -q --cov=app --cov-report=term-missing

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `secrets` context isn't available in step-level `if:` conditions, so pass it
    # through a job-level env var and branch on that instead.
    env:
      DEPLOY_HOOK_SET: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy
        if: ${{ env.DEPLOY_HOOK_SET == 'true' }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render deploy hook responded: $status"
          test "$status" -lt 300
      - name: Render not configured yet
        if: ${{ env.DEPLOY_HOOK_SET == 'false' }}
        run: echo "RENDER_DEPLOY_HOOK_URL secret is not set; skipping deploy. See CLAUDE.md Day 8."
